name: ci

# READ THIS BEFORE TRUSTING A GREEN TICK.
#
# This repo has NO TESTS. Not a thin suite: none. So this workflow is a STRUCTURAL gate,
# not a test suite. It can tell you the provider still has the shape Hermes will call. It
# cannot tell you the provider works.
#
# An import check is not possible either: __init__.py line 35 does
# `from agent.memory_provider import MemoryProvider`, and `agent` is Hermes core, which is
# not installable from PyPI. So the contract is checked with `ast`, which needs no imports.
#
# If you add tests, add a pytest job here in the same PR, and only after you have watched
# it pass. See SOP.md section 4 for the six unit tests worth writing first.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Hermes gateway venv

      # A syntax error here means the memory provider silently fails to load and the
      # gateway runs on with no memory at all.
      - name: Compile every module
        run: python -m compileall -q .

      # Full default rule set, which is clean on this repo today. Pinned so a new upstream
      # rule cannot redden CI without a deliberate bump.
      - name: Lint
        run: |
          python -m pip install --quiet 'ruff==0.15.4'
          ruff check .

      # The MemoryProvider contract. Hermes calls these by name; if one is renamed or
      # dropped, the plugin still imports and still "loads", and the capability just
      # disappears. Nothing else in this repo would catch that.
      - name: Contract check (ast, no imports)
        run: |
          python - <<'PY'
          import ast, sys

          src = open("__init__.py", encoding="utf-8").read()
          tree = ast.parse(src)
          errs = []

          # module-level register(ctx) that registers a MEMORY provider
          reg = next((n for n in tree.body
                      if isinstance(n, ast.FunctionDef) and n.name == "register"), None)
          if reg is None:
              errs.append("no module-level register() function")
          else:
              if [a.arg for a in reg.args.args] != ["ctx"]:
                  errs.append(f"register() args are {[a.arg for a in reg.args.args]}, expected ['ctx']")
              calls = {ast.unparse(n.func) for n in ast.walk(reg) if isinstance(n, ast.Call)}
              if "ctx.register_memory_provider" not in calls:
                  errs.append(f"register() does not call ctx.register_memory_provider (calls: {sorted(calls)})")

          # the provider class and its base
          cls = next((n for n in tree.body
                      if isinstance(n, ast.ClassDef) and n.name == "SkmemoryProvider"), None)
          if cls is None:
              errs.append("class SkmemoryProvider is gone")
          else:
              bases = [ast.unparse(b) for b in cls.bases]
              if "MemoryProvider" not in bases:
                  errs.append(f"SkmemoryProvider bases are {bases}, expected to include MemoryProvider")
              have = {n.name for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              required = {"name", "is_available", "initialize", "system_prompt_block",
                          "prefetch", "sync_turn", "get_tool_schemas", "handle_tool_call",
                          "shutdown"}
              missing = sorted(required - have)
              if missing:
                  errs.append(f"SkmemoryProvider is missing MemoryProvider methods: {missing}")

          # is_available must never import skmemory: its package import hard-raises with
          # no scaffold, which would take the availability probe down with it.
          avail = next((n for n in (cls.body if cls else [])
                        if isinstance(n, ast.FunctionDef) and n.name == "is_available"), None)
          if avail is not None:
              names = {ast.unparse(n.func) for n in ast.walk(avail) if isinstance(n, ast.Call)}
              if "importlib.util.find_spec" not in names:
                  errs.append("is_available() no longer uses importlib.util.find_spec; "
                              "it must NOT import skmemory (that import hard-raises)")

          # the two tool names the model actually sees
          for const, want in (("SEARCH_SCHEMA", "skmemory_search"),
                              ("STORE_SCHEMA", "skmemory_store")):
              node = next((n for n in tree.body
                           if isinstance(n, ast.Assign)
                           and any(getattr(t, "id", None) == const for t in n.targets)), None)
              if node is None:
                  errs.append(f"{const} is gone")
                  continue
              got = ast.literal_eval(node.value).get("name")
              if got != want:
                  errs.append(f"{const}['name'] is {got!r}, documented as {want!r}")

          for e in errs:
              print("FAIL:", e)
          print("contract check:", "FAILED" if errs else "ok")
          sys.exit(1 if errs else 0)
          PY

      # kind: exclusive is why `hermes plugins list` says "not enabled" (SOP.md section 2)
      # and why memory.provider, not plugins.enabled, is the activation lever. If this
      # drifts, the loader path changes underneath the docs.
      - name: Validate plugin.yaml
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml
          m = yaml.safe_load(open("plugin.yaml"))
          errs = []
          if m.get("name") != "skmemory":
              errs.append(f"name is {m.get('name')!r}, expected 'skmemory' "
                          "(the manifest name, not the repo name, is what memory.provider refers to)")
          if m.get("kind") != "exclusive":
              errs.append(f"kind is {m.get('kind')!r}, expected 'exclusive'")
          if not m.get("version"):
              errs.append("no version: field; it is the only version this repo has")
          deps = m.get("pip_dependencies") or []
          if "skmemory" not in [str(d) for d in deps]:
              errs.append(f"pip_dependencies {deps!r} no longer declares skmemory")
          for e in errs:
              print("FAIL:", e)
          sys.exit(1 if errs else 0)
          PY
